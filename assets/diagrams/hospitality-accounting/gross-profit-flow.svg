<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 280" role="img" aria-labelledby="t d"><title id="t">Gross profit calculation</title><desc id="d">Net sales minus cost of goods sold equals gross profit. Example: 60,000 minus 17,000 equals 43,000.</desc><rect width="900" height="280" rx="24" fill="#F4F9FD"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="450" y="48" font-size="25" font-weight="700" fill="#17324D">GROSS PROFIT</text><rect x="55" y="87" width="225" height="112" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="167" y="126" font-size="16" fill="#526578">Net Sales</text><text x="167" y="168" font-size="30" font-weight="700" fill="#17324D">60,000</text><text x="310" y="154" font-size="34" fill="#2878B8">−</text><rect x="345" y="87" width="225" height="112" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="457" y="126" font-size="16" fill="#526578">COGS</text><text x="457" y="168" font-size="30" font-weight="700" fill="#17324D">17,000</text><text x="600" y="154" font-size="30" fill="#2878B8">=</text><rect x="635" y="87" width="210" height="112" rx="16" fill="#17324D"/><text x="740" y="126" font-size="16" fill="#DCECF8">Gross Profit</text><text x="740" y="168" font-size="30" font-weight="700" fill="#fff">43,000</text><text x="450" y="240" font-size="15" fill="#526578">Gross Profit = Net Sales − Cost of Goods Sold</text></g></svg>