<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t d"><title id="t">RevPASH calculation</title><desc id="d">Revenue per available seat hour equals food and beverage revenue divided by available seat hours. Example: 24,000 divided by 120 seat-hours equals 200 per seat-hour.</desc><rect width="960" height="290" rx="24" fill="#F4F9FD"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="48" font-size="25" font-weight="700" fill="#17324D">REVENUE PER AVAILABLE SEAT HOUR</text><rect x="62" y="88" width="285" height="100" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="204" y="126" font-size="16" fill="#526578">F&amp;B Revenue</text><text x="204" y="164" font-size="28" font-weight="700" fill="#17324D">24,000</text><text x="380" y="150" font-size="30" fill="#2878B8">÷</text><rect x="420" y="88" width="285" height="100" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="562" y="126" font-size="16" fill="#526578">Available Seat Hours</text><text x="562" y="164" font-size="28" font-weight="700" fill="#17324D">120</text><text x="740" y="150" font-size="27" fill="#2878B8">=</text><rect x="780" y="88" width="120" height="100" rx="16" fill="#17324D"/><text x="840" y="126" font-size="14" fill="#DCECF8">RevPASH</text><text x="840" y="164" font-size="27" font-weight="700" fill="#fff">200</text><text x="480" y="235" font-size="15" fill="#526578">Measure revenue against seat capacity multiplied by available operating hours.</text><text x="480" y="263" font-size="12" fill="#71869A">Illustrative example · Revenue per seat-hour</text></g></svg>