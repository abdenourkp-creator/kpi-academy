<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">Prime cost composition</title><desc id="d">Prime cost is the sum of food cost of goods sold, beverage cost of goods sold, and labor cost. Example values are 12,000, 5,000, and 15,000, totaling 32,000.</desc><rect width="960" height="320" rx="24" fill="#F4F9FD"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="48" font-size="25" font-weight="700" fill="#17324D">PRIME COST = DIRECT PRODUCT COSTS + LABOR</text><rect x="45" y="91" width="230" height="118" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="160" y="130" font-size="16" fill="#526578">Food COGS</text><text x="160" y="174" font-size="30" font-weight="700" fill="#17324D">12,000</text><text x="300" y="160" font-size="30" fill="#2878B8">+</text><rect x="330" y="91" width="230" height="118" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="445" y="130" font-size="16" fill="#526578">Beverage COGS</text><text x="445" y="174" font-size="30" font-weight="700" fill="#17324D">5,000</text><text x="585" y="160" font-size="30" fill="#2878B8">+</text><rect x="615" y="91" width="230" height="118" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="730" y="130" font-size="16" fill="#526578">Labor Cost</text><text x="730" y="174" font-size="30" font-weight="700" fill="#17324D">15,000</text><path d="M480 220v28" stroke="#2878B8" stroke-width="3"/><path d="M468 239l12 12 12-12" fill="none" stroke="#2878B8" stroke-width="3"/><rect x="310" y="258" width="340" height="48" rx="13" fill="#17324D"/><text x="480" y="290" font-size="23" font-weight="700" fill="#fff">Prime Cost = 32,000</text></g></svg>