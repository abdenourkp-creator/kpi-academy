<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 290" role="img" aria-labelledby="t d"><title id="t">Inventory turnover calculation</title><desc id="d">Inventory turnover equals cost of goods sold divided by average inventory for the same period. Example: 90,000 divided by 15,000 equals six times.</desc><rect width="960" height="290" rx="24" fill="#F4F9FD"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="48" font-size="25" font-weight="700" fill="#17324D">INVENTORY TURNOVER</text><rect x="70" y="88" width="290" height="102" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="215" y="126" font-size="16" fill="#526578">COGS · Same period</text><text x="215" y="164" font-size="28" font-weight="700" fill="#17324D">90,000</text><text x="392" y="150" font-size="30" fill="#2878B8">÷</text><rect x="430" y="88" width="290" height="102" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="575" y="126" font-size="16" fill="#526578">Average Inventory</text><text x="575" y="164" font-size="28" font-weight="700" fill="#17324D">15,000</text><text x="752" y="150" font-size="27" fill="#2878B8">=</text><rect x="790" y="88" width="110" height="102" rx="16" fill="#17324D"/><text x="845" y="126" font-size="14" fill="#DCECF8">TURNOVER</text><text x="845" y="164" font-size="28" font-weight="700" fill="#fff">6×</text><text x="480" y="235" font-size="15" fill="#526578">Use matching time periods and a representative average inventory balance.</text><text x="480" y="263" font-size="12" fill="#71869A">Illustrative example · Currency-neutral values</text></g></svg>