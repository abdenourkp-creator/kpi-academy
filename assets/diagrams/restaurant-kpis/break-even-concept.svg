<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 390" role="img" aria-labelledby="t d"><title id="t">Break-even point concept</title><desc id="d">Conceptual chart showing total revenue and total costs crossing at the break-even point. Before the intersection is loss; after it is profit. Not to scale.</desc><rect width="900" height="390" rx="24" fill="#F4F9FD"/><g font-family="Arial,sans-serif"><text x="450" y="42" text-anchor="middle" font-size="25" font-weight="700" fill="#17324D">BREAK-EVEN POINT</text><path d="M105 315V82M105 315H810" stroke="#526578" stroke-width="2"/><text x="40" y="88" font-size="14" fill="#526578">Value</text><text x="770" y="350" font-size="14" fill="#526578">Sales volume</text><path d="M110 298L760 82" stroke="#2878B8" stroke-width="4" fill="none"/><path d="M110 230L760 120" stroke="#D28A32" stroke-width="4" fill="none"/><path d="M455 183V315" stroke="#17324D" stroke-dasharray="6 6" stroke-width="2"/><circle cx="455" cy="183" r="7" fill="#17324D"/><text x="470" y="172" font-size="15" font-weight="700" fill="#17324D">Break-even</text><text x="215" y="190" font-size="14" fill="#A96C20">Total costs</text><text x="650" y="110" font-size="14" fill="#2878B8">Total revenue</text><text x="220" y="275" font-size="14" fill="#A44C4C">Loss zone</text><text x="620" y="205" font-size="14" fill="#27845C">Profit zone</text><text x="450" y="378" text-anchor="middle" font-size="12" fill="#71869A">Conceptual illustration · Not to scale</text></g></svg>