<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 300" role="img" aria-labelledby="t d"><title id="t">Food cost percentage calculation</title><desc id="d">Food cost percentage equals food cost of goods sold divided by net food sales multiplied by one hundred. Example: 12,000 divided by 40,000 equals 30 percent.</desc><rect width="960" height="300" rx="24" fill="#F4F9FD"/><g font-family="Arial,sans-serif" text-anchor="middle"><text x="480" y="48" font-size="25" font-weight="700" fill="#17324D">FOOD COST %</text><rect x="54" y="82" width="240" height="94" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="174" y="119" font-size="16" fill="#526578">Food COGS</text><text x="174" y="151" font-size="26" font-weight="700" fill="#17324D">12,000</text><text x="330" y="137" font-size="30" fill="#2878B8">÷</text><rect x="366" y="82" width="240" height="94" rx="16" fill="#fff" stroke="#B9D8ED" stroke-width="2"/><text x="486" y="119" font-size="16" fill="#526578">Net Food Sales</text><text x="486" y="151" font-size="26" font-weight="700" fill="#17324D">40,000</text><text x="644" y="137" font-size="27" fill="#2878B8">× 100</text><path d="M725 129h40" stroke="#2878B8" stroke-width="3"/><path d="M755 119l12 10-12 10" fill="none" stroke="#2878B8" stroke-width="3"/><rect x="780" y="82" width="126" height="94" rx="16" fill="#17324D"/><text x="843" y="119" font-size="15" fill="#DCECF8">RESULT</text><text x="843" y="153" font-size="30" font-weight="700" fill="#fff">30%</text><text x="480" y="232" font-size="17" fill="#526578">For every 100 in net food sales, 30 is represented by food COGS.</text><text x="480" y="264" font-size="13" fill="#71869A">Illustrative example · Currency-neutral values</text></g></svg>