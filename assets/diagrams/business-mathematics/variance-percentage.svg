<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Variance Percentage</title><desc id="desc">A five thousand MAD variance has different relative significance against reference values of twenty thousand and two hundred thousand.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF8F0"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17324D"/><stop offset="1" stop-color="#244F70"/></linearGradient></defs>
<rect width="960" height="360" rx="24" fill="url(#bg)"/>
<path d="M0 70H960" stroke="#D8E1E8" stroke-width="1"/>
<text x="44" y="42" fill="#17324D" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">VARIANCE PERCENTAGE</text>

<rect x="42" y="96" width="420" height="184" rx="18" fill="#fff" stroke="#D8E1E8"/><text x="252" y="128" text-anchor="middle" fill="#617487" font-family="Arial" font-size="15" font-weight="700">SAME ABSOLUTE VARIANCE</text><text x="252" y="171" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="34" font-weight="700">+5,000 MAD</text><rect x="82" y="192" width="340" height="16" rx="8" fill="#E7EDF2"/><rect x="82" y="192" width="85" height="16" rx="8" fill="#C69A43"/><text x="252" y="239" text-anchor="middle" fill="#617487" font-family="Arial" font-size="15">Reference 20,000 MAD</text><text x="252" y="263" text-anchor="middle" fill="#A66F22" font-family="Arial" font-size="25" font-weight="700">+25%</text>
<rect x="498" y="96" width="420" height="184" rx="18" fill="#fff" stroke="#D8E1E8"/><text x="708" y="128" text-anchor="middle" fill="#617487" font-family="Arial" font-size="15" font-weight="700">SAME ABSOLUTE VARIANCE</text><text x="708" y="171" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="34" font-weight="700">+5,000 MAD</text><rect x="538" y="192" width="340" height="16" rx="8" fill="#E7EDF2"/><rect x="538" y="192" width="17" height="16" rx="8" fill="#4C9B8D"/><text x="708" y="239" text-anchor="middle" fill="#617487" font-family="Arial" font-size="15">Reference 200,000 MAD</text><text x="708" y="263" text-anchor="middle" fill="#286B60" font-family="Arial" font-size="25" font-weight="700">+2.5%</text>
<text x="480" y="316" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="14" font-weight="700">Variance % = (Actual − Reference) ÷ Reference × 100</text>
<text x="916" y="335" text-anchor="end" fill="#6D7D8A" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">KPI ACADEMY · VISUAL LEARNING</text>
</svg>