<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Percentage Points vs Percentage Change</title><desc id="desc">Food Cost moves from 30 percent to 25 percent: minus five percentage points and minus 16.67 percent relative change.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF8F0"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17324D"/><stop offset="1" stop-color="#244F70"/></linearGradient></defs>
<rect width="960" height="360" rx="24" fill="url(#bg)"/>
<path d="M0 70H960" stroke="#D8E1E8" stroke-width="1"/>
<text x="44" y="42" fill="#17324D" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">PERCENTAGE POINTS VS PERCENTAGE CHANGE</text>

<rect x="42" y="92" width="220" height="170" rx="18" fill="#fff" stroke="#D8E1E8"/><text x="152" y="125" text-anchor="middle" fill="#617487" font-family="Arial" font-size="14">OLD FOOD COST</text><text x="152" y="185" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="52" font-weight="700">30%</text>
<path d="M278 175H330m-12-10 12 10-12 10" fill="none" stroke="#C69A43" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
<rect x="345" y="92" width="220" height="170" rx="18" fill="#fff" stroke="#D8E1E8"/><text x="455" y="125" text-anchor="middle" fill="#617487" font-family="Arial" font-size="14">NEW FOOD COST</text><text x="455" y="185" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="52" font-weight="700">25%</text>
<rect x="600" y="92" width="318" height="78" rx="16" fill="url(#navy)"/><text x="759" y="122" text-anchor="middle" fill="#F6E9C8" font-family="Arial" font-size="14">POINT DIFFERENCE</text><text x="759" y="153" text-anchor="middle" fill="#fff" font-family="Arial" font-size="29" font-weight="700">25% − 30% = −5 pp</text>
<rect x="600" y="184" width="318" height="78" rx="16" fill="#E7F2EF" stroke="#B8D9CF"/><text x="759" y="214" text-anchor="middle" fill="#42796F" font-family="Arial" font-size="14">RELATIVE CHANGE</text><text x="759" y="245" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="27" font-weight="700">(−5 ÷ 30) × 100 = −16.67%</text>
<rect x="42" y="278" width="876" height="34" rx="10" fill="#E9EEF3"/><text x="480" y="300" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="14" font-weight="700">pp = direct difference between rates  •  % change = movement relative to the original rate</text>
<text x="916" y="335" text-anchor="end" fill="#6D7D8A" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">KPI ACADEMY · VISUAL LEARNING</text>
</svg>