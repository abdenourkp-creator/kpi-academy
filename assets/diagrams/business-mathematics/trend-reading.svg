<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Read a Trend Before Making a Decision</title><desc id="desc">Three months of declining beverage sales show a downward pattern, but context is needed before concluding why.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF8F0"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17324D"/><stop offset="1" stop-color="#244F70"/></linearGradient></defs>
<rect width="960" height="360" rx="24" fill="url(#bg)"/>
<path d="M0 70H960" stroke="#D8E1E8" stroke-width="1"/>
<text x="44" y="42" fill="#17324D" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">READ A TREND BEFORE MAKING A DECISION</text>

<rect x="42" y="90" width="560" height="218" rx="18" fill="#fff" stroke="#D8E1E8"/><path d="M100 135V265H550" fill="none" stroke="#AAB8C5" stroke-width="2"/><path d="M100 170H550M100 215H550" stroke="#E7EDF2" stroke-width="1" stroke-dasharray="5 6"/><path d="M150 158L320 203L490 248" fill="none" stroke="#C69A43" stroke-width="5" stroke-linecap="round"/><circle cx="150" cy="158" r="8" fill="#17324D"/><circle cx="320" cy="203" r="8" fill="#17324D"/><circle cx="490" cy="248" r="8" fill="#17324D"/><g fill="#17324D" font-family="Arial" font-size="14" font-weight="700" text-anchor="middle"><text x="150" y="145">100k</text><text x="320" y="190">95k</text><text x="490" y="235">90k</text></g><g fill="#617487" font-family="Arial" font-size="13" text-anchor="middle"><text x="150" y="288">JAN</text><text x="320" y="288">FEB</text><text x="490" y="288">MAR</text></g>
<rect x="630" y="90" width="288" height="218" rx="18" fill="url(#navy)"/><text x="774" y="127" text-anchor="middle" fill="#F6E9C8" font-family="Arial" font-size="15" font-weight="700">BEFORE THE DECISION</text><g fill="#fff" font-family="Arial" font-size="16"><text x="664" y="168">01  Check the time period</text><text x="664" y="205">02  Compare like-for-like</text><text x="664" y="242">03  Investigate seasonality</text><text x="664" y="279">04  Check source and context</text></g>
<text x="916" y="335" text-anchor="end" fill="#6D7D8A" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">KPI ACADEMY · VISUAL LEARNING</text>
</svg>