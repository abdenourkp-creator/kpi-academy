<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" role="img" aria-labelledby="title desc">
<title id="title">Weighted Average</title><desc id="desc">Lunch 100 checks at 100 MAD and dinner 20 checks at 250 MAD produce a weighted average check of 125 MAD.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FBF8F0"/><stop offset="1" stop-color="#EEF3F8"/></linearGradient><linearGradient id="navy" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#17324D"/><stop offset="1" stop-color="#244F70"/></linearGradient></defs>
<rect width="960" height="360" rx="24" fill="url(#bg)"/>
<path d="M0 70H960" stroke="#D8E1E8" stroke-width="1"/>
<text x="44" y="42" fill="#17324D" font-family="Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="1.5">WEIGHTED AVERAGE</text>

<rect x="40" y="100" width="245" height="150" rx="18" fill="#fff" stroke="#D8E1E8"/><text x="162" y="130" text-anchor="middle" fill="#617487" font-family="Arial" font-size="15" font-weight="700">LUNCH</text><text x="162" y="166" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="28" font-weight="700">100 checks</text><text x="162" y="207" text-anchor="middle" fill="#C0933D" font-family="Arial" font-size="25" font-weight="700">× 100 MAD</text>
<text x="310" y="188" fill="#617487" font-family="Arial" font-size="26" font-weight="700">+</text>
<rect x="345" y="100" width="245" height="150" rx="18" fill="#fff" stroke="#D8E1E8"/><text x="467" y="130" text-anchor="middle" fill="#617487" font-family="Arial" font-size="15" font-weight="700">DINNER</text><text x="467" y="166" text-anchor="middle" fill="#17324D" font-family="Arial" font-size="28" font-weight="700">20 checks</text><text x="467" y="207" text-anchor="middle" fill="#C0933D" font-family="Arial" font-size="25" font-weight="700">× 250 MAD</text>
<path d="M610 175H655m-10-9 10 9-10 9" fill="none" stroke="#C69A43" stroke-width="5"/>
<rect x="675" y="88" width="245" height="174" rx="18" fill="url(#navy)"/><text x="797" y="123" text-anchor="middle" fill="#F6E9C8" font-family="Arial" font-size="14">WEIGHTED AVERAGE CHECK</text><text x="797" y="177" text-anchor="middle" fill="#fff" font-family="Arial" font-size="42" font-weight="700">125 MAD</text><text x="797" y="211" text-anchor="middle" fill="#D8E4EC" font-family="Arial" font-size="15">15,000 ÷ 120 checks</text>
<rect x="40" y="276" width="880" height="36" rx="10" fill="#F4EAD5"/><text x="480" y="300" text-anchor="middle" fill="#6B542D" font-family="Arial" font-size="15" font-weight="700">Total sales ÷ total checks  ≠  simple average of 100 and 250</text>
<text x="916" y="335" text-anchor="end" fill="#6D7D8A" font-family="Arial,sans-serif" font-size="11" letter-spacing="1">KPI ACADEMY · VISUAL LEARNING</text>
</svg>