name: KPI Academy QA

permissions:
  contents: read

on:
  push:
    branches:
      - implementation/kpi-academy-mvp
  pull_request:
    branches:
      - main
      - implementation/kpi-academy-mvp

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check assets/js/app.js
          node --check assets/js/kpi-engine.js
          node --check assets/js/calculator.js
          node --check assets/js/learning-engine.js
          node --check assets/js/learning-ui.js
          node --check assets/js/lesson-experience.js
          node --check assets/js/percentage-labs.js
          node --check assets/js/bm001-lab.js
          node --check assets/js/bm002-lab.js
          node --check assets/js/bm003-lab.js
          node --check assets/js/bm004-lab.js
          node --check assets/js/analytics-lab.js
          node --check assets/js/management-simulator.js
          node --check assets/js/live-venue-engine.js
          node --check assets/js/live-venue-archive.js
          node --check assets/js/live-venue.js
          node --check assets/js/study-tools.js
          node --check tests/kpi-engine.test.js
          node --check tests/markdown-renderer.test.js
          node --check tests/content-integrity.test.js
          node --check tests/learning-engine.test.js
          node --check tests/assessment-catalog.test.js
          node --check tests/lesson-experience.test.js
          node --check tests/percentage-labs.test.js
          node --check tests/bm001-lab.test.js
          node --check tests/bm002-lab.test.js
          node --check tests/bm003-lab.test.js
          node --check tests/bm004-lab.test.js
          node --check tests/browser-smoke.test.js
          node --check tests/visual-capture.js
          node --check tests/visual-assets.test.js
          node --check tests/management-simulator.test.js
          node --check tests/live-venue.test.js
          node --check tests/live-venue-archive.test.js
          node --check tests/release-integrity.test.js
          node --check tests/study-tools.test.js
      - name: Run KPI calculation tests
        run: node tests/kpi-engine.test.js
      - name: Run lesson Markdown renderer tests
        run: node tests/markdown-renderer.test.js
      - name: Run curriculum and registry integrity tests
        run: node tests/content-integrity.test.js
      - name: Run learning engine tests
        run: node tests/learning-engine.test.js
      - name: Run assessment catalog tests
        run: node tests/assessment-catalog.test.js
      - name: Run interactive lesson experience tests
        run: node tests/lesson-experience.test.js
      - name: Run percentage lesson labs tests
        run: node tests/percentage-labs.test.js
      - name: Run BM-001 guided lab tests
        run: node tests/bm001-lab.test.js
      - name: Run BM-002 arithmetic lab tests
        run: node tests/bm002-lab.test.js
      - name: Run BM-003 order of operations lab tests
        run: node tests/bm003-lab.test.js
      - name: Run BM-004 rounding and precision lab tests
        run: node tests/bm004-lab.test.js
      - name: Run Analytics Lab tests
        run: node tests/analytics-lab.test.js
      - name: Run Management Simulator scenario tests
        run: node tests/management-simulator.test.js
      - name: Run Live Venue signature simulation tests
        run: node tests/live-venue.test.js
      - name: Run Live Venue archive and comparison tests
        run: node tests/live-venue-archive.test.js
      - name: Run final HTML and asset integrity tests
        run: node tests/release-integrity.test.js
      - name: Run personal study tools tests
        run: node tests/study-tools.test.js
      - name: Run visual asset registry tests
        run: node tests/visual-assets.test.js

  browser:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install isolated Playwright runtime
        run: npm install --prefix /tmp/kpi-playwright --no-save --no-package-lock playwright
      - name: Install Chromium
        run: /tmp/kpi-playwright/node_modules/.bin/playwright install --with-deps chromium
      - name: Run end-to-end browser smoke test
        run: NODE_PATH=/tmp/kpi-playwright/node_modules node tests/browser-smoke.test.js
      - name: Extract verified pre-redesign baseline
        run: |
          git fetch --depth=1 origin d464104ee9511e3567d485d74c7152a8d3b38a25
          mkdir -p /tmp/kpi-baseline
          git archive d464104ee9511e3567d485d74c7152a8d3b38a25 | tar -x -C /tmp/kpi-baseline
      - name: Capture before and after visual screens
        run: NODE_PATH=/tmp/kpi-playwright/node_modules node tests/visual-capture.js /tmp/kpi-baseline
      - name: Upload visual comparison screenshots
        uses: actions/upload-artifact@v4
        with:
          name: kpi-academy-before-after-visuals
          path: test-results/visual-capture/
          if-no-files-found: error
          retention-days: 14

  package:
    needs: [verify, browser]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Assemble static test build
        run: |
          mkdir -p dist
          cp index.html TESTING.md dist/
          cp -r assets data content dist/
          tar -czf kpi-academy-test-build.tar.gz -C dist .
      - name: Upload test build artifact
        uses: actions/upload-artifact@v4
        with:
          name: kpi-academy-test-build
          path: kpi-academy-test-build.tar.gz
          if-no-files-found: error
          retention-days: 14


  deploy-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/implementation/kpi-academy-mvp'
    needs: [verify, browser, package]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout preview source
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Assemble preview site
        run: |
          mkdir -p dist
          cp index.html TESTING.md dist/
          cp -r assets data content dist/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: kpi-academy-preview-${{ github.sha }}
          path: dist
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: kpi-academy-preview-${{ github.sha }}
