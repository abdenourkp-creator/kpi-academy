<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KPI Academy — BiDi regression cases</title><link rel="stylesheet" href="../assets/css/tokens.css"><link rel="stylesheet" href="../assets/css/base.css"><style>body{padding:24px}.test{max-width:820px;margin:18px auto;padding:20px;border:1px solid var(--ka-border-blue);border-radius:20px;background:var(--ka-glass-1)}.case{padding:10px 0;border-bottom:1px solid var(--ka-border)}.case:last-child{border:0}.case-label{display:block;color:var(--ka-muted);font-size:13px}bdi{color:var(--ka-gold-bright);unicode-bidi:isolate;font-size:18px}</style><script src="../assets/js/namespace.js" defer></script><script src="../assets/js/ar.js" defer></script><script src="../assets/js/en.js" defer></script><script src="../assets/js/bidi.js" defer></script></head>
